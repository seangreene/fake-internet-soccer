name: Deploy to production

# Run it from the repo's Actions tab ("Run workflow"), or by publishing a release.
#
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   BAKER_AWS_ACCESS_KEY_ID
#   BAKER_AWS_SECRET_ACCESS_KEY
#   BAKER_AWS_S3_PRODUCTION_REGION   e.g. us-west-1
#   BAKER_AWS_S3_PRODUCTION_BUCKET   just the bucket name, no s3:// or URL
#   DATAWRAPPER_API_TOKEN            optional; without it chart versions come from the CDN

concurrency:
  group: deploy-prod-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - id: install-project-modules
        name: Install project dependencies
        run: npm ci --omit=dev

      - id: install-action-modules
        name: Install action dependencies
        run: npm install --no-save archieml

      - id: get-slug
        name: Get slug
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const fs = require('fs');
            const archieml = require('archieml');

            const meta = archieml.load(fs.readFileSync('_data/meta.aml', 'utf8'));

            // An empty slug means the site lives at the root of the bucket
            const slug = (meta.slug || '').trim();
            console.log(`slug -> "${slug}"`);
            return slug;

      - id: npm-build
        name: Build project distribution
        run: npm run build
        env:
          BAKER_PATH_PREFIX: ${{ steps.get-slug.outputs.result }}
          DATAWRAPPER_TOKEN: ${{ secrets.DATAWRAPPER_API_TOKEN }}

      - id: configure-aws
        name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.BAKER_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.BAKER_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.BAKER_AWS_S3_PRODUCTION_REGION }}

      - id: npm-deploy
        name: Upload the prepared files
        uses: datadesk/delivery-deploy-action@v1
        with:
          bucket: ${{ secrets.BAKER_AWS_S3_PRODUCTION_BUCKET }}
          base-path: ${{ steps.get-slug.outputs.result }}
          dir: _dist
          should-cache: true
          use-accelerate-endpoint: false
          public: true
